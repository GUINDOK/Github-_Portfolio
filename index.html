<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kadidiatou Guindo | Ingénieure Éco-Énergétique</title>
    <style>
        :root {
            /* Palette Bleu Nuit Sophistiqué & Ardoise */
            --primary: #1e293b;         /* Ardoise sombre haut de gamme */
            --primary-accent: #2c3e50;  /* Bleu nuit profond */
            --accent-blue: #3b5998;     /* Bleu discret */
            --bg-light: #f8fafc;
            --badge-bg: #eef2f6;        /* Gris-bleu très doux */
            --badge-text: #334155;
            --text-main: #0f172a;       /* Encre sombre élégante */
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: var(--text-main);
            background-color: #f1f5f9;
            padding: 2.5rem 1rem;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #ffffff;
            padding: 3rem;
            border-radius: 14px;
            box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.05), 0 8px 10px -6px rgba(15, 23, 42, 0.03);
            border: 1px solid var(--border-color);
        }
        header {
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 2rem;
            margin-bottom: 2rem;
        }
        .header-profile {
            display: flex;
            align-items: center;
            gap: 2rem;
            flex-wrap: wrap;
        }
        .profile-img {
            width: 140px;
            height: auto;
            max-height: 170px;
            border-radius: 12px;
            object-fit: contain;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.08);
            background-color: #ffffff;
        }
        .header-info {
            flex: 1;
            min-width: 260px;
        }
        h1 { 
            color: var(--primary); 
            font-size: 2.1rem; 
            letter-spacing: -0.02em;
            margin-bottom: 0.35rem; 
            font-weight: 700;
        }
        .subtitle { 
            font-size: 1.1rem; 
            color: var(--text-muted); 
            font-weight: 500; 
        }
        
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background-color: #f0fdf4;
            color: #166534;
            border: 1px solid #bbf7d0;
            padding: 0.35rem 0.85rem;
